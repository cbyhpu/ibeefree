<meta name="theme-color" content="#0D1C39">

<title>IBeeFree</title>
<style>
  :root {
    --bg: #F4F1E8; --card: #FFFFFF; --text: #0D1C39; --muted: #4A5575;
    --brand: #DDAE40; --brand-text: #000000; --hdr: #0D1C39; --title: #0D1C39; --mine: #F3E3B0; --mine-text: #000000; --theirs: #FFFFFF;
    --line: #E0D9C6; --danger: #B42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #081630; --card: #112347; --text: #EAF0FA; --muted: #9FB0CE;
      --brand: #DDAE40; --brand-text: #000000; --hdr: #0D1C39; --title: #E3B554; --mine: #DDAE40; --mine-text: #000000; --theirs: #172E5C;
      --line: #223869; --danger: #F97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
    font-size: 16px; -webkit-text-size-adjust: 100%;
  }
  #root { height: 100%; }
  .center { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; max-width: 420px; margin: 0 auto; }
  .center h1 { margin: 0; color: var(--title); }
  .center p { margin: 0; color: var(--muted); }
  input[type="text"], textarea.msgbox {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); color: var(--text); font-size: 16px; font-family: inherit;
  }
  input[type="text"]:focus, textarea.msgbox:focus { outline: 2px solid var(--brand); border-color: transparent; }
  button { font-family: inherit; font-size: 16px; cursor: pointer; border: 0; border-radius: 12px; }
  button.primary { background: var(--brand); color: var(--brand-text); padding: 12px 18px; }
  button.primary:disabled { opacity: .6; }
  button.small { background: transparent; color: var(--title); padding: 4px 10px; border: 1px solid var(--title); border-radius: 999px; font-size: 14px; }
  .msg { min-height: 1.3em; color: var(--danger); font-size: 14px; }
  .screen { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--hdr); color: #fff; }
  header h2 { margin: 0; font-size: 18px; flex: 1; }
  header button.back { background: transparent; color: #fff; font-size: 22px; padding: 0 6px; }
  .codebox { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .codebox .code { letter-spacing: 3px; font-size: 18px; direction: ltr; }
  .add { display: flex; gap: 8px; padding: 12px 16px 0; }
  .add input { flex: 1; direction: ltr; text-transform: uppercase; }
  #addMsg { padding: 0 16px; margin: 6px 0 0; }
  .list { flex: 1; overflow-y: auto; padding: 8px 0 env(safe-area-inset-bottom, 0px); }
  .contact { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--card); }
  .contact:active { background: var(--bg); }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: var(--brand-text); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 32px 24px; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 80%; padding: 8px 10px; border-radius: 14px; word-break: break-word; white-space: pre-wrap; border: 1px solid var(--line); }
  .bubble.mine { align-self: flex-start; background: var(--mine); }
  .bubble.theirs { align-self: flex-end; background: var(--theirs); }
  .bubble img { display: block; max-width: 100%; max-height: 320px; border-radius: 10px; margin-bottom: 4px; cursor: zoom-in; }
  .bubble .time { font-size: 11px; color: var(--muted); margin-top: 2px; text-align: end; direction: ltr; }
  .composer { display: flex; gap: 8px; align-items: center; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--line); }
  .composer textarea.msgbox { flex: 1; min-width: 0; resize: none; overflow-y: auto; line-height: 1.45; max-height: 9em; white-space: pre-wrap; display: block; }
  .composer { align-items: flex-end; }
  .composer button { padding: 10px 14px; }
  .composer button.attach { background: transparent; font-size: 22px; padding: 6px 8px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .overlay img { max-width: 100%; max-height: 100%; }
  .contact .acts { margin-inline-start: auto; display: flex; gap: 6px; }
  .contact.req { background: var(--mine); }
  .del { background: none; color: var(--muted); font-size: 12px; padding: 0 4px; border: 0; }
  button.danger { background: var(--danger); color: #fff; padding: 12px 18px; }
  .phrase { direction: ltr; font-family: monospace; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 18px; line-height: 1.7; word-spacing: 6px; user-select: all; }
  .bubble { color: var(--text); }
  .bubble.mine { color: var(--mine-text); }
  .bubble.mine .time { color: #000000; }
  [dir="ltr"] .bubble.mine { align-self: flex-end; }
  [dir="ltr"] .bubble.theirs { align-self: flex-start; }

  /* ===== وضوح الخط ===== */
  .bubble { font-size: 16.5px; line-height: 1.55; font-weight: 500; }
  .bubble.mine { font-weight: 600; }
  .bubble .time { font-size: 12px; font-weight: 500; }
  .bubble.mine .time { opacity: 1; }
  button.primary { font-weight: 700; }
  .contact { font-weight: 500; }
  /* ===== اسم التطبيق: موجة الحروف الصفراء ===== */
  .brand { display: inline-block; direction: ltr; unicode-bidi: isolate; font-weight: 700; letter-spacing: .5px; }
  .brand .ch { display: inline-block; color: #fff; animation: ibfwave 2.6s linear infinite; }
  @keyframes ibfwave { 0%, 16%, 100% { color: #fff; } 4%, 10% { color: var(--brand); } }
  /* ===== عبارة الهوية ===== */
  .hpu { display: inline-block; direction: ltr; unicode-bidi: isolate; min-width: 8ch; text-align: center; white-space: nowrap; font-size: 14px; color: #cdd6ea;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { .brand .ch { animation: none; } }

  /* ===== (1) نبض ©byHPU™ بعد توقف الحروف العشوائية ===== */
  .hpu.pulse { animation: hpubeat 1.2s ease-in-out 3; }
  @keyframes hpubeat {
    0%   { color: #cdd6ea; transform: scale(1); }
    10%  { color: var(--brand); transform: scale(1.16); }
    20%  { color: #cdd6ea; transform: scale(1.02); }
    30%  { color: var(--brand); transform: scale(1.10); }
    42%, 100% { color: #cdd6ea; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .hpu.pulse { animation: none; } }
  header { gap: 8px; padding-left: 12px; padding-right: 12px; }
  header h2 { min-width: 0; font-size: 17px; white-space: nowrap; }
  button.hbtn { padding: 2px 9px; font-size: 16px; }

  /* ===== (5) شريط حالة التركيز + تخطيط الصفحة ===== */
  body { display: flex; flex-direction: column; height: var(--vvh, 100dvh); }
  html.kb #focusbar { display: none; }
  #root { flex: 1; min-height: 0; height: auto; display: flex; flex-direction: column; }
  #root > .center { flex: 1; width: 100%; }
  .screen { flex: 1; min-height: 0; height: auto; padding-top: 0; }
  #focusbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; direction: ltr;
    min-height: 30px; padding: calc(4px + env(safe-area-inset-top, 0px)) 14px 4px; background: #06101F; color: #cdd6ea; font-size: 13px; }
  .fb-clock { background: none; color: inherit; padding: 0 4px; min-height: 24px; display: flex; align-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 8px; }
  .fb-bat, .fb-net { unicode-bidi: isolate; white-space: nowrap; }
  .fb-net.on { color: #6EE7A0; }
  .fb-net.off { color: #F97066; }

  /* ===== (3) خط وألوان مربع النص ===== */
  .bubble { font-size: var(--tb-fs, 16.5px); font-family: var(--tb-ff, inherit); }
  .composer textarea.msgbox { font-size: var(--tb-fs, 16px); font-family: var(--tb-ff, inherit); }
  html[data-tb] .bubble.mine, html[data-tb] .composer textarea.msgbox { background: var(--tb-bg); color: var(--tb-fg); }
  html[data-tb] .bubble.mine .time, .bubble.sc .time { color: inherit; opacity: 1; }
  .sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { width: 100%; max-width: 480px; max-height: 92dvh; overflow: auto; background: var(--card); color: var(--text); border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .sheet h3 { margin: 0; color: var(--title); }
  .sheet .lbl { font-weight: 700; font-size: 14px; color: var(--muted); }
  .pvbox { position: sticky; top: 0; z-index: 1; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    line-height: 1.55; font-weight: 600; background: var(--tb-bg); color: var(--tb-fg); font-size: var(--tb-fs); font-family: var(--tb-ff); }
  .rg { display: flex; align-items: center; gap: 10px; direction: ltr; }
  .rg input { flex: 1; }
  .chips, .sws { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border: 2px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px; }
  .sw { padding: 8px 12px; border: 2px solid var(--line); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .sw .sw-a { font-size: 18px; font-weight: 700; }
  .chip[aria-pressed="true"], .sw[aria-pressed="true"] { border-color: #D4A22F; outline: 3px solid #D4A22F; }
  .fsw { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sect { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  /* ===== نظام إشعارات النحل وقرص العسل ===== */
  .hexo { padding: 2px; background: linear-gradient(135deg,#EBC862,#D4A22F); clip-path: polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%); }
  .hexi { background: var(--card); color: var(--text); padding: 12px 28px; min-height: 52px; display: flex; align-items: center; gap: 12px; clip-path: polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%); }
  .hexi .grow { flex: 1; font-weight: 700; font-size: 15px; }
  .emb, .hext .ic { position: relative; isolation: isolate; width: 38px; height: 42px; flex: none; display: grid; place-items: center; font-size: 20px; line-height: 1; background: linear-gradient(#EBC862,#D4A22F); clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .emb::before, .hext .ic::before { content: ""; position: absolute; inset: 2px; z-index: -1; background: #081630; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .hext .ic { width: 46px; height: 50px; font-size: 24px; }
  .hsw { width: 54px; height: 30px; padding: 3px; border: 0; border-radius: 15px; background: #8a8f9c; display: flex; align-items: center; justify-content: flex-start; flex: none; transition: background .2s; }
  .hsw i { display: block; width: 24px; height: 24px; background: #fff; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); transition: transform .2s; }
  .hsw.on { background: linear-gradient(90deg,#EBC862,#D4A22F); }
  .hsw.on i { transform: translateX(24px); }
  html[dir="rtl"] .hsw.on i { transform: translateX(-24px); }
  .hsw:disabled { opacity: .4; }
  .hgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 12%; }
  .hgrid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding-bottom: 22px; }
  .hgrid3 > :nth-child(2) { transform: translateY(22px); }
  .hext { padding: 2px; border: 0; background: var(--line); aspect-ratio: .9 / 1; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .hext.on { background: linear-gradient(135deg,#EBC862,#D4A22F); }
  .hext .hin { width: 100%; height: 100%; background: var(--card); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 14px 10px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.2; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .hext.sel .hin { background: linear-gradient(135deg,#EBC862,#D4A22F); color: #000; }
  .hext .ic { font-size: 24px; }
  .hext small { font-size: 11px; font-weight: 600; opacity: .85; }
  .minibn { width: 44px; height: 14px; background: linear-gradient(#EBC862,#D4A22F); clip-path: polygon(6px 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,6px 100%,0 50%); }
  .hbadge { min-width: 26px; height: 28px; padding: 0 5px; margin-inline-start: 8px; background: linear-gradient(#EBC862,#D4A22F); color: #000; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
  .hbadge.mini { min-width: 20px; height: 22px; font-size: 11px; margin: 0; }
  .seg { display: flex; gap: 6px; flex: 1; }
  .seg button { flex: 1; padding: 8px 6px; font-size: 13px; font-weight: 700; background: transparent; color: var(--text); border: 2px solid var(--line); border-radius: 10px; }
  .seg button[aria-pressed="true"] { background: linear-gradient(#EBC862,#D4A22F); color: #000; border-color: #D4A22F; }
  .ns-note { margin: 0; font-size: 12.5px; color: var(--muted); }
  .ns-dim { opacity: .45; pointer-events: none; }
  .hback { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 24px; font-size: 15px; font-weight: 800; color: #000; background: linear-gradient(#EBC862,#D4A22F); border: 0; border-radius: 0; clip-path: polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%); }
  header button.back { clip-path: polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%); background: rgba(255,255,255,.18); padding: 4px 20px; }
  .hexbtn { display: inline-flex; align-items: center; gap: 12px; padding: 8px 28px; font-weight: 800; color: #000; background: linear-gradient(#EBC862,#D4A22F); border-radius: 0; clip-path: polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%); }
  .hbanner { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(92vw,420px); z-index: 50; padding: 2px; cursor: pointer; background: linear-gradient(135deg,#EBC862,#D4A22F); clip-path: polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%); animation: hbin .35s ease-out; }
  .hbanner .hb-in { background: #0D1C39; color: #fff; padding: 12px 28px; display: flex; align-items: center; gap: 10px; clip-path: polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%); }
  .hbanner .hb-ic { font-size: 22px; }
  .hbanner .hb-tx { display: flex; flex-direction: column; min-width: 0; }
  .hbanner .hb-tx b { color: #EBC862; }
  .hbanner .hb-tx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes hbin { from { transform: translate(-50%,-130%); } to { transform: translate(-50%,0); } }
  @media (prefers-reduced-motion: reduce) { .hbanner { animation: none; } .hsw, .hsw i { transition: none; } }
  .sect h4 { margin: 0; font-size: 16px; color: var(--title); padding-bottom: 6px; border-bottom: 2px solid #D4A22F; }

  /* ===== (4) أيقونتا السلة والتبليغ: نظيفتان ومنسجمتان مع الرسالة ===== */
  .bubble .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .bubble .foot .time { margin-top: 0; margin-inline-start: auto; }
  .bubble .del, .bubble.mine .del { background: none; border: 0; border-radius: 8px; padding: 3px 5px; min-width: 30px; min-height: 30px;
    display: inline-flex; align-items: center; justify-content: center; color: inherit; opacity: .8; margin: 0; font-size: 0; }
  .bubble .del:active { opacity: 1; background: rgba(0,0,0,.12); }
  .bubble .del svg { width: 18px; height: 18px; display: block; }
  .bubble button.small, .contact.req .small { background: #0D1C39; color: #DDAE40; border: 1px solid #DDAE40; border-radius: 10px; }
  .bubble button.small { padding: 6px 12px; }

  /* ===== (3) أسود داكن وصريح: سماكة وحدّ خفيف للنص الأسود ===== */
  .bubble.mine, .pvbox { -webkit-text-stroke: var(--tb-stk, .3px #000000); font-weight: var(--tb-fw, 600); }
  html[data-tb] .composer textarea.msgbox { font-weight: var(--tb-fw, 600); -webkit-text-stroke: var(--tb-stk, 0px transparent); }

  /* ===== (2) الساعة: أكبر قليلاً ===== */
  #focusbar { min-height: 58px; }
  .fb-clock { --clk: 50px; min-height: 50px; }
  .fb-clock svg { display: block; width: var(--clk); height: var(--clk); filter: drop-shadow(0 0 calc(var(--clk) * .1) rgba(255, 26, 26, .4)); }
  .fb-clock .dh, .fb-clock .dc, .fb-clock .dm { font-size: 24px; line-height: 1; font-weight: 800; -webkit-text-stroke: .3px #FF1A1A; paint-order: stroke fill; text-shadow: 0 0 2.4px rgba(255, 26, 26, .6); }
  .fb-clock .dh { color: #DDAE40; }
  .fb-clock .dc, .fb-clock .dm { color: #FFFFFF; }

  /* ===== الفيديو داخل الفقاعة ===== */
  .vwrap { margin-bottom: 4px; }
  .vid { display: block; width: 100%; max-width: 270px; min-height: 120px; max-height: 320px; border-radius: 10px; background: #000; }
  .vplay { display: block; }

  /* ===== شريط الضبط ===== */
  .tune { display: flex; flex-direction: column; gap: 4px; }
  .tl { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tnum { min-width: 34px; text-align: center; background: #D4A22F; color: #000; border-radius: 999px; padding: 2px 8px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cr { font-size: 13px; font-weight: 700; }

  /* ===== عبارة الهوية: تبقى في أقصى الشريط بجانب الأزرار ===== */
  header .hpu { flex: none; }

  /* ===== (7) توقيع About: في الأسفل، بلا عناوين ===== */
  .sign { display: flex; flex-direction: column; gap: 4px; text-align: center; direction: ltr; margin-top: auto; padding-top: 20px; }
  .sign-1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; color: var(--text); }
  .sign-2 { font-size: 14px; color: var(--muted); }
  .sign-3 { font-size: 14px; color: var(--muted); direction: rtl; }
  /* ===== قاعدة التصميم السداسي الدائمة: كل عنصر جديد يُبنى سداسياً افتراضياً ===== */
  :root { --hx: polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%); --hx6: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); --hxc: polygon(20px 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 20px),calc(100% - 20px) 100%,20px 100%,0 calc(100% - 20px),0 20px); }
  button.primary, button.danger { clip-path: var(--hx); border-radius: 0; padding-inline: 28px; }
  button.small, button.chip, .chip, .sw, button.hbtn { clip-path: var(--hx); border-radius: 0; border: 0; padding-inline: 18px; }
  button.small { background: color-mix(in srgb, var(--title) 14%, transparent); }
  header button.small { background: rgba(255,255,255,.18); }
  .chip { background: var(--line); }
  .chip[aria-pressed="true"] { background: linear-gradient(#EBC862,#D4A22F); color: #000; outline: 0; }
  .sw[aria-pressed="true"] { outline: 0; box-shadow: inset 0 0 0 4px #D4A22F; }
  .composer button.attach { clip-path: var(--hx6); background: color-mix(in srgb, var(--title) 14%, transparent); }
  input[type="text"], textarea.msgbox, select { clip-path: var(--hx); border-color: transparent; border-radius: 0; padding-inline: 22px; }

let nsReady = false, curChat = null;
function nsDetect(snap) {
  snap.docChanges().forEach((ch) => {
    if (!nsReady || ch.doc.metadata.hasPendingWrites) return;
    const data = ch.doc.data({ serverTimestamps: "estimate" });
    if (ch.type === "added" && data.status === "pending") notifyEvent("req", { id: ch.doc.id, ...data });
  });
  nsReady = true;
}

/* الرسائل: مستمع لآخر رسالة في كل محادثة مقبولة. الملكية بمعرّف المرسل (from) ومعرّف الرسالة، بلا أي مؤقت */
const nsMsgSubs = {}, nsSeenMsg = new Set();
function nsSyncMsgListeners() {
  const want = new Map(contacts.filter((c) => c.status === "accepted" && c.chatId).map((c) => [c.chatId, c]));
  for (const cid of Object.keys(nsMsgSubs)) {
    if (!want.has(cid)) { nsMsgSubs[cid].unsub(); delete nsMsgSubs[cid]; } else nsMsgSubs[cid].c = want.get(cid);
  }
  for (const [cid, c] of want) {
    if (nsMsgSubs[cid]) continue;
    const o = { c, ready: false, unsub: null };
    o.unsub = onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("ts", "desc"), limit(1)),
      (snap) => {
        snap.docChanges().forEach((ch) => {
          if (ch.type !== "added" || nsSeenMsg.has(ch.doc.id)) return;
          nsSeenMsg.add(ch.doc.id);
          if (!o.ready || ch.doc.metadata.hasPendingWrites) return;
          const m = ch.doc.data({ serverTimestamps: "estimate" });
          if (!m || m.from === me.uid || m.deleted) return;      // رسالتي أنا: لا تنبيه
          if (curChat === o.c.id && !document.hidden) return;    // المحادثة مفتوحة أمامك
          notifyEvent("dm", o.c, m);
        });
        o.ready = true;
      }, (e) => console.error(e));
    nsMsgSubs[cid] = o;
  }
}

    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub && PUSH_CONFIG.vapidPublicKey && "Notification" in window && Notification.permission === "granted") {

    h("div", { class: "szprev" }, h("div", { class: "szghost" }), hex, dl),
    h("p", { class: "ns-note" }, s9("layoutw") + " " + layoutW + " dp"),
    h("h4", { class: "h4" }, s9("fontfine")),

    h("div", { class: "chips" },
      chip("A−", () => setFs((TB.fs || DEF) - 0.5), false, "stp"),

const PRES = {}, presSubs = {};

async function writePresence(state) {
  if (!me || !db) return;
  try { await setDoc(doc(db, "presence", me.uid), { pstate: state, pts: serverTimestamp(), allowRename: allowRenameMe }, { merge: true }); }
  catch (e) { if (!writePresence.w) { writePresence.w = 1; console.warn("presence", e); } }
}
const presTick = () => { if (me && !document.hidden) writePresence(myStatusPref === "busy" ? "busy" : "online"); };

  if (presOn || !me) return; presOn = true;
  presTick(); setInterval(presTick, 40000); setInterval(() => renderContacts(), 30000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) writePresence("offline"); else presTick(); });
  window.addEventListener("pagehide", () => writePresence("offline"));
}
function presSync() {
  const want = new Set(contacts.filter((c) => c.status === "accepted").map((c) => c.id));
  for (const id of Object.keys(presSubs)) if (!want.has(id)) { presSubs[id](); delete presSubs[id]; delete PRES[id]; }
  for (const id of want) {
    if (presSubs[id]) continue;
    presSubs[id] = onSnapshot(doc(db, "presence", id), (snap) => {
      const d = snap.exists() ? snap.data({ serverTimestamps: "estimate" }) : {};
      PRES[id] = { state: d.pstate || "offline", ts: d.pts && d.pts.toMillis ? d.pts.toMillis() : 0, allowRename: d.allowRename === true };

    }, () => { PRES[id] = { unknown: true }; renderContacts(); });
  }
}

}

function gearIcon() {
  const teeth = 8, hole = 3.2;
  const inside = (x, y) => {
    const dx = x - 12, dy = y - 12, d = Math.hypot(dx, dy);
    if (d < hole) return false;
    return d <= 7 + (Math.cos(teeth * Math.atan2(dy, dx)) > 0.15 ? 2.5 : 0);
  };
  let path = "";
  for (let y = 2.8; y <= 21.2; y += 1.7) {
    let x0 = null;
    for (let x = 1; x <= 23.01; x += 0.25) {
      const on = inside(x, y);
      if (on && x0 === null) x0 = x;
      if (!on && x0 !== null) { path += "M" + x0.toFixed(2) + " " + y.toFixed(2) + "H" + (x - 0.25).toFixed(2); x0 = null; }
    }
  }
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + path + '" stroke="#EBC862" stroke-width="1.1" fill="none"/></svg>';
}

/* تلوين الحروف المستهدفة داخل نص الفقاعة (لا يؤثر على العدّاد) */
function hvDecorate(txt) {

/* اختيار لون يناسب خلفية كل فقاعة ولونها الأصلي (خارج Reading Mode فهو يحدد ألوانه بنفسه) */
const HL_PAL = ["#FFE14A", "#00E5FF", "#FF3D6E", "#B0003A", "#0057FF", "#FFFFFF", "#00A86B"];

const contrast2 = (a, b) => { const x = lumOf2(a), y = lumOf2(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const rgbOf = (css) => { const m = String(css).match(/[\d.]+/g); return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null; };
function hvTint(box) {

  box.querySelectorAll(".bubble").forEach((b) => {
    if (!b.querySelector(".hl")) return;
    const cs = getComputedStyle(b), bg = cs.backgroundColor;
    if (/,\s*0\)$/.test(bg)) return;
    const bgc = rgbOf(bg), fg = rgbOf(cs.color); if (!bgc) return;
    let best = HL_PAL[0], bs = -1;
    for (const p of HL_PAL) {
      const n = parseInt(p.slice(1), 16), c3 = [n >> 16, (n >> 8) & 255, n & 255];
      const dist = fg ? Math.hypot(c3[0] - fg[0], c3[1] - fg[1], c3[2] - fg[2]) : 200;
      const sc = Math.min(contrast2(c3, bgc), 7) + (dist > 110 ? 3 : 0);
      if (sc > bs) { bs = sc; best = p; }

}

/* العدّاد: يحسب الحروف المستهدفة في ما ترسله أنت (حد أقصى 20 حرفاً لكل رسالة) ويعمل حتى لو أُوقف التلوين */
function hvCount(text) {
  if (typeof text !== "string") return;
  let n = 0; const seg = {};
  for (const mt of (text.match(HV_RE) || [])) { if (n >= 20) break; const k = hvKey(mt); seg[k] = (seg[k] || 0) + 1; n++; }
  if (!n) return;
  const before = HV.total; HV.total += n;
  for (const k in seg) HV.per[k] = (HV.per[k] || 0) + seg[k];
  for (const ms of HV_MILESTONES) if (before < ms && HV.total >= ms && !HV.reached.includes(ms)) { HV.reached.push(ms); hvMilestone(ms); }
  saveHV();
}
function hvMilestone(ms) {
  playNotificationSound("hive:milestone-" + ms, { always: true });      // فتحة صوت محجوزة وفارغة
  if (ms === 100) { hiveCelebration(); return; }
  if (ms === 1000000) HV.perks.push({ id: "million", until: Date.now() + 7 * 864e5 });   // ميزة كبيرة مؤقتة: تُحدَّد لاحقاً
  hiveCard(ms);
}

function hiveOverlay(inner, ms, onClose) {
  const old = document.getElementById("hivefx"); if (old) old.remove();
  const ov = h("div", { id: "hivefx", class: "hivefx", role: "dialog" });
  ov.style.setProperty("--bee", BEE_SIZE + "px");
  ov.innerHTML = inner;
  let done = false;
  const close = () => { if (done) return; done = true; ov.remove(); if (onClose) onClose(); };
  ov.addEventListener("click", close);
  document.body.append(ov); setTimeout(close, ms);
  return ov;
}
function hiveCelebration() {
  const parts = Array.from({ length: 22 }, (_, i) => '<i class="pt" style="--x:' + (6 + (i * 47) % 88) + '%;--d:' + ((i % 8) * 0.4).toFixed(2) + 's;--s:' + (3 + (i % 4) * 2) + 'px"></i>').join("");
  const stars = Array.from({ length: 10 }, (_, i) => { const a = i * 36 * Math.PI / 180, r = 62 + (i % 3) * 10; return '<i class="sp" style="left:' + (50 + Math.cos(a) * r).toFixed(1) + '%;top:' + (50 + Math.sin(a) * r).toFixed(1) + '%;--d:' + ((i % 5) * 0.28).toFixed(2) + 's"></i>'; }).join("");
  playNotificationSound("hive:bee-buzz", { always: true, action: "start" });          // فتحة صوت محجوزة وفارغة: طنين الرفرفة
  const ov = hiveOverlay('<div class="hfx-stage"><div class="hfx-pts">' + parts + '</div><div class="hfx-flyer"><i class="hfx-aura"></i>' + BEE_SVG + stars + '</div>' +

    () => playNotificationSound("hive:bee-buzz", { always: true, action: "stop" }));

/* ----- Hive Store: مجلد محلي (IndexedDB) بملفات فرعية: صور / نصوص / أخرى ----- */
let hiveDbP = null;
const hiveDB = () => hiveDbP || (hiveDbP = new Promise((res, rej) => {
  const rq = indexedDB.open("ibf_hive_db", 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore("items", { keyPath: "id" });
  rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
}));
const hiveTx = async (mode, fn) => {
  const d = await hiveDB();
  return new Promise((res, rej) => { const tx = d.transaction("items", mode), r = fn(tx.objectStore("items")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
};
const hiveAll = () => hiveTx("readonly", (st) => st.getAll());
const hiveDel = (id) => hiveTx("readwrite", (st) => st.delete(id));
async function hiveSaveMsg(c, m) {
  if (m.deleted) return;
  const base = { id: c.chatId + ":" + m.id, chatName: dispName(c) || c.name || "", ms: msgMs(m), mine: m.from === me.uid };
  const small = typeof m.thumb === "string" ? m.thumb : m.image;
  if (m.hasFile) {
    let d = null; try { d = await fullOf(m, c); } catch (_) {}
    await hiveTx("readwrite", (st) => st.put({ ...base, kind: "other", fileName: m.fileName || "file", dataUrl: d || null, text: m.text || "" }));
  } else if (typeof small === "string" && small.startsWith("data:image")) {
    let d = null; try { d = await fullOf(m, c); } catch (_) {}
    await hiveTx("readwrite", (st) => st.put({ ...base, kind: "image", dataUrl: d || small, text: m.text || "" }));
  } else if (typeof m.text === "string" && m.text) {
    await hiveTx("readwrite", (st) => st.put({ ...base, kind: "text", text: m.text }));
  }
}
function openHiveFolder(kind) {

    const rows = list.map((it) => {
      const meta = h("div", { class: "ns-note" }, (it.chatName || "") + " · " + new Date(it.ms).toLocaleString(LANG === "ar" ? "ar-TN-u-nu-latn" : LANG));
      const del = h("button", { type: "button", class: "small" }, s9("hv_delete"));
      del.addEventListener("click", async () => { if (!confirm(s9("hv_delete") + " ?")) return; await hiveDel(it.id); list = list.filter((x) => x.id !== it.id); render(); });
      const acts = h("div", { class: "row" }, del);
      let body;
      if (it.kind === "image") { body = h("img", { src: it.dataUrl, class: "hvimg", alt: "" }); body.addEventListener("click", () => openImage(it.dataUrl)); }
      else body = h("div", { class: "hvtxt" }, it.kind === "other" ? "📄 " + (it.fileName || "") : it.text);
      if (it.kind === "text") { const cp = h("button", { type: "button", class: "small" }, s9("m_copy")); cp.addEventListener("click", () => { if (navigator.clipboard) navigator.clipboard.writeText(it.text).then(() => toast(s9("copied"))).catch(() => {}); }); acts.prepend(cp); }
      if (it.kind === "other" && it.dataUrl) { const dl = h("button", { type: "button", class: "small" }, s9("hv_open")); dl.addEventListener("click", () => { const a = h("a", { href: it.dataUrl, download: it.fileName || "file" }); document.body.append(a); a.click(); a.remove(); }); acts.prepend(dl); }
      return h("div", { class: "hvrow" }, body, meta, acts);

    return [h("h3", {}, s9(kind === "image" ? "hv_images" : kind === "text" ? "hv_texts" : "hv_other")), rows.length ? null : h("p", { class: "ns-note" }, s9("hv_empty")), ...rows];
  });
}

    ...(perks.length ? [h("h4", { class: "h4" }, s9("hv_perks")), ...perks.map((p) => h("p", { class: "ns-note" }, s9("hv_perk_m") + " · " + s9("hv_until") + " " + new Date(p.until).toLocaleDateString(LANG === "ar" ? "ar-TN-u-nu-latn" : LANG)))] : []),

/* ---------- عبارة الهوية: تبديل عشوائي ثم استقرار، وتتكرر ---------- */
const GLYPHS = "!@#$%&*+=?<>/\\|~^§¤µ¶ΩΣ¥€£0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function scrambleLoop(el, finalText) {
  el.textContent = finalText;
  if (document.documentElement.dataset.anim === "off") return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const chars = Array.from(finalText);
  const n = chars.length;
  let frame = 0;
  const rnd = () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  function tick() {
    if (!el.isConnected) return;                       // الشاشة تغيّرت: أوقف الحلقة
    if (document.hidden) { setTimeout(tick, 1000); return; }
    if (frame === 0) el.classList.remove("pulse");
    let out = "", done = true;
    for (let i = 0; i < n; i++) {
      if (frame >= 10 + i * 3) out += chars[i];
      else { out += rnd(); done = false; }
    }
    el.textContent = out;
    if (done) {                                        // استقر النص: نبض أصفر 3 مرات ثم تعود الدورة
      el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
      frame = 0; setTimeout(tick, 4200);
    }
    else { frame++; setTimeout(tick, 45); }
  }
  tick();
}
function hpuNode() {
  const el = h("span", { class: "hpu", "aria-label": "byHPU" }, "©byHPU™");
  requestAnimationFrame(() => scrambleLoop(el, "©byHPU™"));
  return el;
}

async function shrinkImage(file, limitChars = 250000, maxSide = 1280) {
  const bmp = await createImageBitmap(file);
  let quality = 0.72;
  for (let i = 0; i < 6; i++) {
    const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(bmp.width * s));
    cv.height = Math.max(1, Math.round(bmp.height * s));
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", quality);
    if (url.length < limitChars) return url;
    maxSide = Math.round(maxSide * 0.75);
    quality = Math.max(0.5, quality - 0.05);
  }
  throw new Error(t(49));
}

    if (m.thumb && !dataSaver()) fullRetry(m, c).then((f) => { if (f) img.src = f; });
  }
  if (m.hasFile) {
    const fb = h("button", { class: "small" }, "📄 " + (m.fileName || t(53)) + " (" + Math.round((m.fileSize || 0) / 1024) + t(54));
    fb.addEventListener("click", async () => {
      const d = await fullOf(m, c);
      if (!d) { alert(t(55)); return; }
      const a = h("a", { href: d, download: m.fileName || "file" });
      document.body.append(a); a.click(); a.remove();
    });
    bubble.append(VIDEO_RE.test(m.fileName || "") && m.id ? videoNode(m, c, fb) : fb);
  }
  if (typeof m.text === "string" && m.text) bubble.append(h("div", { class: "mt" }, hvDecorate(m.text)));
  const foot = h("div", { class: "foot" });
  if (mine && m.id) {
    const del = h("button", { class: "del", type: "button", "aria-label": t(56), title: t(56) });
    del.innerHTML = ICON_TRASH;
    del.addEventListener("click", async () => {
      if (!confirm(t(57))) return;
      try { await updateDoc(doc(db, "chats", c.chatId, "messages", m.id), { deleted: true, text: deleteField(), image: deleteField(), thumb: deleteField(), fileName: deleteField() });
        await deleteDoc(doc(db, "chats", c.chatId, "media", m.id)).catch(() => {}); mediaCache.delete(m.id); }
      catch (e) { console.error(e); alert(t(27) + explain(e)); }
    });
    foot.append(del);
  }
  if (!mine && m.id) {
    const rp = h("button", { class: "del", type: "button", "aria-label": t(58), title: t(58) });
    rp.innerHTML = ICON_FLAG;
    rp.addEventListener("click", async () => {
      if (!confirm(t(59))) return;
      try {
        await addDoc(collection(db, "reports"), { reporter: me.uid, reported: c.id, chatId: c.chatId, msgId: m.id, text: (m.text || "").slice(0, 2000), ts: serverTimestamp() });
        alert(t(60));
      } catch (e) { alert(t(61) + explain(e)); }
    });
    foot.append(rp);
  }
  const d = m.ts && m.ts.toDate ? m.ts.toDate() : new Date();
  foot.append(h("div", { class: "time" }, d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })));
  bubble.append(foot);
  return bubble;
}

function sendErr(e) {
  alert(e && e.code === "permission-denied"
    ? t(62)
    : t(63) + explain(e));
}

let noCs = false;
async function addMsgDoc(c, payload) {
  const col = collection(db, "chats", c.chatId, "messages");
  const base = { from: me.uid, ...payload, ts: serverTimestamp() };
  if (TB.cs && !noCs) {
    try { return await addDoc(col, { ...base, cs: TB.cs }); }
    catch (e) { if (!(e && e.code === "permission-denied")) throw e; noCs = true; }
    try { return await addDoc(col, base); } catch (e) { noCs = false; throw e; }
  }
  return addDoc(col, base);
}
async function sendMessage(c, payload, media) {
  const ref = await addMsgDoc(c, payload);
  if (media) await setDoc(doc(db, "chats", c.chatId, "media", ref.id), { from: me.uid, data: media });
  await Promise.allSettled([
    setDoc(doc(db, "users", me.uid, "contacts", c.id), { lastTs: serverTimestamp() }, { merge: true }),
    setDoc(doc(db, "users", c.id, "contacts", me.uid), { lastTs: serverTimestamp() }, { merge: true })
  ]);
}

function openChat(c, push = true) {
  stopMsgs();
  curChat = c.id; clearUnread(c.id);
  if (push) history.pushState({ chat: c.id }, "");
  try { sessionStorage.setItem("ibf_chat", c.id); } catch (_) {}

  const box = h("div", { class: "msgs" });
  const input = h("textarea", { class: "msgbox", rows: "1", dir: "auto", placeholder: t(64), autocomplete: "off", enterkeyhint: "enter" });
  const fileInput = h("input", { type: "file", style: "display:none" });
  const attach = h("button", { class: "attach", "aria-label": t(65) }, "📎");
  const sendBtn = h("button", { class: "primary" }, t(66));
  input.addEventListener("focus", () => { setTimeout(() => { scrollNewest(box); input.scrollIntoView({ block: "nearest" }); }, 250); });

  // الحقل يكبر تلقائياً حسب عدد الأسطر (حتى حدّ أقصى ثم يظهر تمرير داخلي)
  const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, Math.round(window.innerHeight * 0.3)) + "px"; };
  input.addEventListener("input", grow);
  const send = async () => {
    const t = input.value.replace(/\s+$/, "").replace(/^\s*\n/, "");
    if (!t.trim()) return;
    input.value = ""; grow();
    try { await sendMessage(c, { text: t }); hvCount(t); }
    catch (e) { console.error(e); input.value = t; grow(); sendErr(e); }
  };
  sendBtn.addEventListener("click", send);
  // إبقاء لوحة المفاتيح مفتوحة عند الضغط على زر الإرسال
  sendBtn.addEventListener("mousedown", (ev) => ev.preventDefault());
  // زر Enter يُنزل سطراً دائماً. الإرسال بزر الإرسال فقط (أو Ctrl+Enter على الحاسوب)
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); send(); } });
  attach.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    try {
      if (f.type.startsWith("image/")) {
        const full = await shrinkImage(f);
        const thumb = await shrinkImage(f, 20000, 160);
        await sendMessage(c, { thumb, hasImage: true }, full);
      } else {
        if (f.size > 600000) throw new Error(t(67));
        const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
        await sendMessage(c, { hasFile: true, fileName: f.name.slice(0, 80), fileSize: f.size }, data);
      }
    } catch (e) { console.error(e); sendErr(e); }
    finally { fileInput.value = ""; }
  });

  const back = h("button", { class: "back chatback", "aria-label": t(12) }, t(73));
  back.addEventListener("click", backFromChat);
  let items = [];
  const draw = () => drawMsgs(box, items, c);
  const cog = h("button", { class: "fb-q", type: "button", "aria-label": s9("chat_set"), title: s9("chat_set") });
  cog.innerHTML = gearIcon();
  cog.addEventListener("click", () => openChatSettings(c, () => { draw(); scrollNewest(box); }));
  SEL = null;
  const jumpTo = (id) => {
    const el = box.querySelector('[data-id="' + id + '"]'); if (!el) return;
    el.scrollIntoView({ block: "center", inline: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1900);
  };
  const rd = h("button", { class: "fb-q" + (UI.reading ? " on" : ""), type: "button", "aria-label": s9("reading"), title: s9("reading") });
  rd.append(iconNode("book"));
  rd.addEventListener("click", () => { UI.reading = !UI.reading; saveUI(); applyUI(); rd.classList.toggle("on", !!UI.reading); });
  const srch = h("button", { class: "fb-q", type: "button", "aria-label": s9("search"), title: s9("search") });
  srch.innerHTML = SEARCH_SVG;
  srch.addEventListener("click", () => openChatSearch(c, () => items, jumpTo));
  const copyText = (txt) => { if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(s9("copied"))).catch(() => {}); };
  const selbar = h("div", { class: "selbar", style: "display:none" });
  function updateSel() {
    if (!SEL) { selbar.style.display = "none"; return; }
    selbar.style.display = "flex";
    const cp = h("button", { type: "button", class: "small" }, s9("m_copy")), dl = h("button", { type: "button", class: "small" }, s9("m_delete")), cn = h("button", { type: "button", class: "small" }, s9("cancel"));
    cp.addEventListener("click", () => { const txt = items.filter((m) => SEL.has(m.id) && !m.deleted && typeof m.text === "string" && m.text).map((m) => m.text).join("\n"); if (txt) copyText(txt); });
    dl.addEventListener("click", async () => {
      const own = items.filter((m) => SEL.has(m.id) && m.from === me.uid && !m.deleted);
      if (!own.length) { toast(s9("only_own")); return; }
      if (!confirm(s9("del_n") + own.length)) return;
      try { for (const m of own) await deleteMsgDoc(c, m); } catch (e) { console.error(e); alert(t(27) + explain(e)); }
      clearSel();
    });
    cn.addEventListener("click", clearSel);
    const hvb = h("button", { type: "button", class: "small" }, "🐝 " + s9("hv_save"));
    hvb.addEventListener("click", async () => {
      try { for (const m of items.filter((x) => SEL.has(x.id))) await hiveSaveMsg(c, m); toast(s9("hv_saved")); } catch (e) { console.error(e); alert(String((e && e.message) || e)); }
    });
    selbar.replaceChildren(h("span", { class: "selcount" }, s9("selected") + " " + SEL.size), cp, hvb, dl, cn);
  }
  function clearSel() { SEL = null; box.querySelectorAll(".bubble.sel").forEach((b) => b.classList.remove("sel")); updateSel(); }
  const toggleSel = (b) => { const id = b.dataset.id; if (!id || !SEL) return; if (SEL.has(id)) SEL.delete(id); else SEL.add(id); b.classList.toggle("sel", SEL.has(id)); updateSel(); };
  const startSel = (id) => { SEL = new Set([id]); box.querySelectorAll('.bubble[data-id="' + id + '"]').forEach((b) => b.classList.add("sel")); updateSel(); };
  const openMsgMenu = (m) => panel("mmenu", (render, close) => {
    const act = (ic, label, fn) => { const b = h("button", { type: "button", class: "sbox" }, mkBar(h("span", { class: "emb" }, ic), h("span", { class: "grow" }, label))); b.addEventListener("click", () => { close(); fn(); }); return b; };
    return [
      h("h3", {}, s9("msg_actions")),
      m.text ? act("📋", s9("m_copy"), () => copyText(m.text)) : null,
      act("☑", s9("m_select"), () => startSel(m.id)),
      act("🐝", s9("hv_save"), () => hiveSaveMsg(c, m).then(() => toast(s9("hv_saved"))).catch((e) => { console.error(e); alert(String((e && e.message) || e)); })),
      (m.from === me.uid && !m.deleted) ? act("🗑", s9("m_delete"), async () => {
        if (!confirm(t(57))) return;
        try { await deleteMsgDoc(c, m); } catch (e) { console.error(e); alert(t(27) + explain(e)); }
      }) : null
    ];
  });
  // ضغطة مطوّلة (أو نقر يمين) على فقاعة: قائمة الإجراءات. لا تتعارض مع السحب، تعمل سواء كانت الإيماءات مفعّلة أم لا
  box.addEventListener("contextmenu", (e) => {
    const b = e.target.closest && e.target.closest(".bubble"); if (!b || !b.dataset.id) return;
    e.preventDefault();
    if (SEL) { toggleSel(b); return; }
    const m = items.find((x) => x.id === b.dataset.id); if (m) openMsgMenu(m);
  });
  // أثناء التحديد: النقر يبدّل التحديد بدل فتح الصور والأزرار
  box.addEventListener("click", (e) => {
    if (!SEL) return;
    const b = e.target.closest && e.target.closest(".bubble"); if (!b) return;
    e.preventDefault(); e.stopPropagation(); toggleSel(b);
  }, true);

  mount(h("div", { class: "screen" },
    h("header", {}, back, h("h2", {}, dispName(c) || t(32)), rd, srch, cog),
    box,
    selbar,
    h("div", { class: "composer" + (CV.btnSide === "left" ? " btnleft" : "") }, input, h("div", { class: "cstack" }, sendBtn, attach), fileInput)));

  const q = query(collection(db, "chats", c.chatId, "messages"), orderBy("ts", "desc"), limit(200));
  unsubMsgs = onSnapshot(q,
    (snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).reverse();
      draw();
      rerenderChat = () => { const st = [box.scrollTop, box.scrollLeft]; draw(); box.scrollTop = st[0]; box.scrollLeft = st[1]; };
      scrollNewest(box);
    },
    (err) => {
      console.error(err);
      box.replaceChildren(h("p", { class: "msg" }, t(70) + explain(err)));
    });
}

window.addEventListener("popstate", () => {
  const open = document.querySelector(".sheetbg, .overlay");
  if (open) { open.remove(); if (curChat) history.pushState({ chat: curChat }, ""); return; }
  if (me) showList();
});

/* ---------- البداية ---------- */
function start() {
  if (window.visualViewport) {          // الكيبورد: ارتفاع الصفحة = المساحة المرئية فعلاً
    const vv = window.visualViewport;
    let maxH = vv.height;
    const fit = () => {
      maxH = Math.max(maxH, vv.height);
      document.documentElement.style.setProperty("--vvh", Math.round(vv.height) + "px");
      document.documentElement.classList.toggle("kb", vv.height < maxH * 0.8);
      if (window.scrollY) window.scrollTo(0, 0);
      const box = document.querySelector(".msgs");
      if (box && document.activeElement && document.activeElement.tagName === "INPUT") box.scrollTop = box.scrollHeight;
    };
    vv.addEventListener("resize", fit);
    vv.addEventListener("scroll", fit);
    fit();
  }
  initFocusBar();
  if (Object.values(firebaseConfig).some((v) => String(v).startsWith("PASTE"))) {
    showFatal(t(71));
    return;
  }
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);

  onAuthStateChanged(auth, async (user) => {
    if (busy) return;
    if (!user) { showStart(); return; }
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        me = { uid: user.uid, name: d.name, code: d.code, nameChanges: +d.nameChanges || 0 };
        showList();
      } else {
        showNameForm();
      }
    } catch (e) {
      console.error(e);
      showFatal(t(72) + explain(e));
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => initPushSubscription()).catch(() => {});
  }
}
start();
</script>

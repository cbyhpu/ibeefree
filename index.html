function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // بدون أحرف متشابهة (O/0 و I/1)
function randomCode() {
  const a = new Uint32Array(6);
  crypto.getRandomValues(a);
  return Array.from(a, (n) => ALPHABET[n % ALPHABET.length]).join("");
}

async function createProfile(name) {
  const uid = auth.currentUser.uid;
  let code = null;
  let lastErr = null;
  for (let i = 0; i < 8 && !code; i++) {
    const c = randomCode();
    try {
      const snap = await getDoc(doc(db, "codes", c));
      if (snap.exists()) continue;
      await setDoc(doc(db, "codes", c), { uid, name });
      code = c;
    } catch (e) { lastErr = e; }
  }
  if (!code) throw lastErr || new Error(t(0));
  await setDoc(doc(db, "users", uid), { name, code });
  me = { uid, name, code };
}

const WORDS = "able acid aged also arch area army atom aunt axis baby back bake ball band bank barn base bath bead beam bean bear beat bell belt bend bike bill bird bite blue boat body bold bolt bone book boot born boss bowl bulb bull bush busy cafe cage cake calm camp card care cart case cash cave cell chef chin chip city clay clip club coal coat code coin cold cook cool cord corn cost crab crew crop crow cube cup dark dart dash data dawn deal deck deer desk dial dice dish dive dock dome door dove down draw drum duck dust duty east edge fair farm fast fawn fern file fill film fire fish flag flat flax flow foam fold food foot fork form fort frog fuel gain game gate gear gift girl glad glow glue goat gold golf gown grab gray grid grip gulf gust hair hall hand harp hawk heap herb hill hint hive hold home hood hook hope horn host hour hunt idea inch iron isle jade jar jazz join joy jump keen kelp key kick kite knot lake lamp land lane lark lava leaf lens lily lime line lion list loaf lock loft loop lord luck lung mail main male malt map mask mast meal melt mesh mild milk mill mind mint mist moon moss moth nail navy nest news node note oak oath oven pace page palm park path pear pine pipe plan plum pond pool port pump quay rain ramp reed rice ring road robe rock roof root".split(" ");

  const a = new Uint8Array(12);
  crypto.getRandomValues(a);

}
async function deriveCreds(phrase) {
  const norm = phrase.toLowerCase().trim().split(/\s+/).join(" ");
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("ibeefree-v1"), iterations: 100000 }, key, 384);
  const hex = Array.from(new Uint8Array(bits), (b) => b.toString(16).padStart(2, "0")).join("");
  return { email: hex.slice(0, 32) + "@ibeefree.app", password: hex.slice(32) };
}

  mount(h("div", { class: "center" }, h("img", { src: "logo.png", alt: "I Bee Free by HPU", style: "width:min(78%,320px);align-self:center;border-radius:22px" }), ...ABOUT.slice(0, 3).map((x) => h("p", {}, x)), langPicker(), btn));
}
async function deleteAccount() {
  if (!confirm(t(24))) return;
  const ph = prompt(t(25));
  if (!ph) return;
  try {
    const cr = await deriveCreds(ph);
    await signInWithEmailAndPassword(auth, cr.email, cr.password);
    if (auth.currentUser.uid !== me.uid) throw new Error("wrong-account");
  } catch (e) { alert(t(26)); return; }
  try {
    for (const c of contacts) {
      await deleteDoc(doc(db, "users", me.uid, "contacts", c.id));
      try { await deleteDoc(doc(db, "users", c.id, "contacts", me.uid)); } catch (_) {}
    }
    await deleteDoc(doc(db, "codes", me.code));
    await deleteDoc(doc(db, "users", me.uid));
    await auth.currentUser.delete();
    location.reload();
  } catch (e) { console.error(e); alert(t(27) + explain(e)); }
}
function showAbout() {
  const ds = h("input", { type: "checkbox", id: "ds" });
  ds.checked = dataSaver();
  ds.addEventListener("change", () => { try { localStorage.setItem("ibf_ds", ds.checked ? "1" : "0"); } catch (_) {} });
  const del = h("button", { class: "danger" }, t(28));
  del.addEventListener("click", deleteAccount);
  const back = h("button", { class: "back", "aria-label": t(12) }, t(73));
  back.addEventListener("click", showList);
  mount(h("div", { class: "screen" },
    h("header", {}, back, h("h2", {}, t(29))),
    h("div", { class: "center", style: "flex:1;overflow:auto" }, h("img", { src: "logo.png", alt: "I Bee Free by HPU", style: "width:min(60%,240px);align-self:center;border-radius:18px" }), ...ABOUT.map((x) => h("p", {}, x)), langPicker(), h("label", {}, ds, t(30)), del)));
}

/* ---------- شاشة قائمة الأصدقاء ---------- */
function renderContacts() {
  if (!listEl) return;
  if (!contacts.length) {
    listEl.replaceChildren(h("div", { class: "empty" }, t(31)));
    return;
  }
  const sorted = [...contacts].filter((c) => c.status !== "blocked").sort((a, b) => {
    const ta = a.lastTs && a.lastTs.toMillis ? a.lastTs.toMillis() : 0;
    const tb = b.lastTs && b.lastTs.toMillis ? b.lastTs.toMillis() : 0;
    return tb - ta;
  });
  const setStatus = (c, status) => updateDoc(doc(db, "users", me.uid, "contacts", c.id), { status }).catch((e) => alert(explain(e)));
  listEl.replaceChildren(...sorted.map((c) => {
    const avatar = h("div", { class: "avatar" }, (c.name || "?").trim().charAt(0));
    if (c.status === "pending") {
      return h("div", { class: "contact req" }, avatar, h("div", {}, c.name || t(32), t(33)),
        h("div", { class: "acts" },
          h("button", { class: "small accept", onclick: () => setStatus(c, "accepted") }, t(34)),
          h("button", { class: "small block", onclick: () => setStatus(c, "blocked") }, t(35))));
    }
    return h("div", { class: "contact", onclick: () => openChat(c) }, avatar, h("div", {}, c.name || t(32)));
  }));
}

async function addFriend(rawCode) {
  const code = rawCode.trim().toUpperCase();
  if (code.length !== 6) throw new Error(t(36));
  const snap = await getDoc(doc(db, "codes", code));
  if (!snap.exists()) throw new Error(t(37));
  const friend = snap.data();
  if (friend.uid === me.uid) throw new Error(t(38));
  const chatId = chatIdFor(me.uid, friend.uid);
  const mine = doc(db, "users", me.uid, "contacts", friend.uid);
  const ex = await getDoc(mine);
  if (ex.exists()) {
    if (ex.data().status === "pending") await updateDoc(mine, { status: "accepted" });
    else if (ex.data().status === "blocked") throw new Error(t(39));
    return { id: friend.uid, name: friend.name, chatId };
  }
  await setDoc(mine, { name: friend.name, chatId, status: "accepted", lastTs: serverTimestamp() });
  try {
    await setDoc(doc(db, "users", friend.uid, "contacts", me.uid),
      { name: me.name, chatId, status: "pending", lastTs: serverTimestamp() });
  } catch (e) {
    await deleteDoc(mine).catch(() => {});
    throw new Error(t(40));
  }
  return { id: friend.uid, name: friend.name, chatId };
}

function showList() {
  stopMsgs();
  listEl = h("div", { class: "list" });
  const copyBtn = h("button", { class: "small" }, t(41));
  copyBtn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(me.code); copyBtn.textContent = t(42); }
    catch (_) { copyBtn.textContent = t(43); }
    setTimeout(() => { copyBtn.textContent = t(41); }, 1500);
  });
  const addInput = h("input", { type: "text", maxlength: "6", placeholder: t(44), autocapitalize: "characters", autocomplete: "off" });
  const addMsg = h("p", { class: "msg", id: "addMsg" });
  const addBtn = h("button", { class: "primary" }, t(45));
  addBtn.addEventListener("click", async () => {
    addMsg.textContent = "";
    addBtn.disabled = true;
    try {
      const c = await addFriend(addInput.value);
      addInput.value = "";
      openChat(c);
    } catch (e) {
      if (e.code) console.error(e);
      addMsg.textContent = e.message && !e.code ? e.message : t(46) + explain(e);
    } finally { addBtn.disabled = false; }
  });

  mount(h("div", { class: "screen" },
    h("header", {}, h("h2", {}, APP_NAME), h("span", { class: "me" }, me.name), h("button", { class: "small", style: "color:#fff;border-color:#fff", onclick: showAbout }, t(47))),
    h("div", { class: "codebox" }, h("span", {}, t(48)), h("b", { class: "code" }, me.code), copyBtn),
    h("div", { class: "add" }, addInput, addBtn),
    addMsg,
    listEl));
  renderContacts();

  if (!unsubContacts) {
    unsubContacts = onSnapshot(collection(db, "users", me.uid, "contacts"),
      (snap) => {
        contacts = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }));
        renderContacts();
      },
      (err) => console.error(err));
  }
}

/* ---------- الصور: تصغيرها قبل الإرسال ---------- */
async function shrinkImage(file, limitChars = 250000, maxSide = 1280) {
  const bmp = await createImageBitmap(file);
  let quality = 0.72;
  for (let i = 0; i < 6; i++) {
    const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(bmp.width * s));
    cv.height = Math.max(1, Math.round(bmp.height * s));
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const url = cv.toDataURL("image/jpeg", quality);
    if (url.length < limitChars) return url;
    maxSide = Math.round(maxSide * 0.75);
    quality = Math.max(0.5, quality - 0.05);
  }
  throw new Error(t(49));
}

const mediaCache = new Map();
function dataSaver() {
  try {
    const v = localStorage.getItem("ibf_ds");
    if (v !== null) return v === "1";
  } catch (_) {}
  return !!(navigator.connection && navigator.connection.saveData);
}
async function fullOf(m, c) {
  if (!(m.thumb || m.hasFile)) return m.image || null;
  if (mediaCache.has(m.id)) return mediaCache.get(m.id);
  try {
    const sn = await getDoc(doc(db, "chats", c.chatId, "media", m.id));
    const d = sn.exists() ? sn.data().data : null;
    if (d) mediaCache.set(m.id, d);
    return d;
  } catch (_) { return null; }
}
async function fullRetry(m, c) {
  for (let i = 0; i < 4; i++) {
    const f = await fullOf(m, c);
    if (f) return f;
    await new Promise((r) => setTimeout(r, 1200));
  }
  return null;
}
function openImage(src) {
  const save = h("a", { href: src, download: "ibeefree.jpg", style: "position:fixed;top:12px;inset-inline-end:12px;color:#fff;background:#0008;padding:8px 12px;border-radius:10px;text-decoration:none" }, t(50));
  save.addEventListener("click", (e) => e.stopPropagation());
  const ov = h("div", { class: "overlay" }, h("img", { src, alt: t(51) }), save);
  ov.addEventListener("click", () => ov.remove());
  document.body.append(ov);
}

/* ---------- شاشة المحادثة ---------- */
function renderMsg(m, c) {
  const mine = m.from === me.uid;
  const bubble = h("div", { class: "bubble " + (mine ? "mine" : "theirs") });
  if (m.deleted) {
    bubble.append(h("div", { style: "font-style:italic;opacity:.7" }, t(52)));
    return bubble;
  }
  const small = typeof m.thumb === "string" ? m.thumb : m.image;
  if (typeof small === "string" && small.startsWith("data:image/jpeg;base64,")) {
    const img = h("img", { src: small, alt: t(51) });
    img.addEventListener("click", async () => openImage((await fullOf(m, c)) || small));
    bubble.append(img);
    if (m.thumb && !dataSaver()) fullRetry(m, c).then((f) => { if (f) img.src = f; });
  }
  if (m.hasFile) {
    const fb = h("button", { class: "small" }, "📄 " + (m.fileName || t(53)) + " (" + Math.round((m.fileSize || 0) / 1024) + t(54));
    fb.addEventListener("click", async () => {
      const d = await fullOf(m, c);
      if (!d) { alert(t(55)); return; }
      const a = h("a", { href: d, download: m.fileName || "file" });
      document.body.append(a); a.click(); a.remove();
    });
    bubble.append(fb);
  }
  if (typeof m.text === "string" && m.text) bubble.append(h("div", {}, m.text));
  if (mine && m.id) {
    const del = h("button", { class: "del", "aria-label": t(56) }, "🗑");
    del.addEventListener("click", async () => {
      if (!confirm(t(57))) return;
      try { await updateDoc(doc(db, "chats", c.chatId, "messages", m.id), { deleted: true, text: deleteField(), image: deleteField(), thumb: deleteField(), fileName: deleteField() });
        await deleteDoc(doc(db, "chats", c.chatId, "media", m.id)).catch(() => {}); mediaCache.delete(m.id); }
      catch (e) { console.error(e); alert(t(27) + explain(e)); }
    });
    bubble.append(del);
  }
  if (!mine && m.id) {
    const rp = h("button", { class: "del", "aria-label": t(58) }, "⚑");
    rp.addEventListener("click", async () => {
      if (!confirm(t(59))) return;
      try {
        await addDoc(collection(db, "reports"), { reporter: me.uid, reported: c.id, chatId: c.chatId, msgId: m.id, text: (m.text || "").slice(0, 2000), ts: serverTimestamp() });
        alert(t(60));
      } catch (e) { alert(t(61) + explain(e)); }
    });
    bubble.append(rp);
  }
  const d = m.ts && m.ts.toDate ? m.ts.toDate() : new Date();
  bubble.append(h("div", { class: "time" }, d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })));
  return bubble;
}

function sendErr(e) {
  alert(e && e.code === "permission-denied"
    ? t(62)
    : t(63) + explain(e));
}

async function sendMessage(c, payload, media) {
  const ref = await addDoc(collection(db, "chats", c.chatId, "messages"),
    { from: me.uid, ...payload, ts: serverTimestamp() });
  if (media) await setDoc(doc(db, "chats", c.chatId, "media", ref.id), { from: me.uid, data: media });
  await Promise.allSettled([
    setDoc(doc(db, "users", me.uid, "contacts", c.id), { lastTs: serverTimestamp() }, { merge: true }),
    setDoc(doc(db, "users", c.id, "contacts", me.uid), { lastTs: serverTimestamp() }, { merge: true })
  ]);
}

function openChat(c, push = true) {
  stopMsgs();
  if (push) history.pushState({ chat: c.id }, "");

  const box = h("div", { class: "msgs" });
  const input = h("input", { type: "text", placeholder: t(64), autocomplete: "off" });
  const fileInput = h("input", { type: "file", style: "display:none" });
  const attach = h("button", { class: "attach", "aria-label": t(65) }, "📎");
  const sendBtn = h("button", { class: "primary" }, t(66));

  const send = async () => {
    const t = input.value.trim();
    if (!t) return;
    input.value = "";
    try { await sendMessage(c, { text: t }); }
    catch (e) { console.error(e); input.value = t; sendErr(e); }
  };
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); send(); } });
  attach.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    try {
      if (f.type.startsWith("image/")) {
        const full = await shrinkImage(f);
        const thumb = await shrinkImage(f, 20000, 160);
        await sendMessage(c, { thumb, hasImage: true }, full);
      } else {
        if (f.size > 600000) throw new Error(t(67));
        const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
        await sendMessage(c, { hasFile: true, fileName: f.name.slice(0, 80), fileSize: f.size }, data);
      }
    } catch (e) { console.error(e); sendErr(e); }
    finally { fileInput.value = ""; }
  });

  const back = h("button", { class: "back", "aria-label": t(12) }, t(73));
  back.addEventListener("click", () => history.back());

  mount(h("div", { class: "screen" },
    h("header", {}, back, h("h2", {}, c.name || t(32)),
      h("button", { class: "small", style: "color:#fff;border-color:#fff", onclick: async () => {
        if (!confirm(t(68) + (c.name || t(69)) + t(32))) return;
        try { await updateDoc(doc(db, "users", me.uid, "contacts", c.id), { status: "blocked" }); history.back(); }
        catch (e) { alert(explain(e)); }
      } }, t(35))),
    box,
    h("div", { class: "composer" }, attach, input, sendBtn, fileInput)));

  const q = query(collection(db, "chats", c.chatId, "messages"), orderBy("ts", "desc"), limit(200));
  unsubMsgs = onSnapshot(q,
    (snap) => {
      const items = snap.docs.map((d) => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).reverse();
      box.replaceChildren(...items.map((m) => renderMsg(m, c)));
      box.scrollTop = box.scrollHeight;
    },
    (err) => {
      console.error(err);
      box.replaceChildren(h("p", { class: "msg" }, t(70) + explain(err)));
    });
}

window.addEventListener("popstate", () => { if (me) showList(); });

/* ---------- البداية ---------- */
function start() {
  if (Object.values(firebaseConfig).some((v) => String(v).startsWith("PASTE"))) {
    showFatal(t(71));
    return;
  }
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);

  onAuthStateChanged(auth, async (user) => {
    if (busy) return;
    if (!user) { showStart(); return; }
    try {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        me = { uid: user.uid, name: d.name, code: d.code };
        showList();
      } else {
        showNameForm();
      }
    } catch (e) {
      console.error(e);
      showFatal(t(72) + explain(e));
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
start();
